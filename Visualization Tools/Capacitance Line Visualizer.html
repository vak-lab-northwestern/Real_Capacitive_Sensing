<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capacitance Line Explorer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fafaf8;--panel:#fff;--text:#1d1d1b;--muted:#6b6b66;--border:#dcdcd5;--grid:#ececE6;--accent:#2a6df4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--panel:#202024;--text:#ececea;--muted:#9a9aa2;--border:#38383f;--grid:#2c2c32;--accent:#6b9bff}}
:root[data-theme="dark"]{--bg:#17171a;--panel:#202024;--text:#ececea;--muted:#9a9aa2;--border:#38383f;--grid:#2c2c32;--accent:#6b9bff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
h1{font-size:16px;margin:0;font-weight:600}
.meta{color:var(--muted);font-size:12px;flex:1;min-width:140px}
button,label.btn{font:inherit;padding:5px 11px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:6px;cursor:pointer}
button:hover,label.btn:hover{border-color:var(--accent)}
main{display:flex;gap:12px;padding:12px;height:calc(100vh - 62px);min-height:420px}
#plotwrap{flex:1;min-width:0;position:relative;background:var(--panel);border:1px solid var(--border);border-radius:8px}
canvas{width:100%;height:100%;display:block;cursor:crosshair}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.2);white-space:nowrap}
aside{width:230px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.tools{padding:8px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--border)}
.tools button{padding:3px 8px;font-size:12px}
.opts{padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;display:grid;gap:5px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
#key{overflow:auto;flex:1;padding:4px}
.row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:5px;cursor:pointer;user-select:none}
.row:hover{background:var(--grid)}.row.sel{background:var(--grid);font-weight:600}
.sw{width:18px;height:4px;border-radius:2px}
.hint{font-size:11px;color:var(--muted);padding:6px 10px;border-top:1px solid var(--border)}
#drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(42,109,244,.12);border:2px dashed var(--accent);border-radius:8px;font-size:18px}
@media (max-width:720px){main{flex-direction:column;height:auto}#plotwrap{height:60vh}aside{width:auto;max-height:40vh}}
.seg{display:inline-flex}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:6px 0 0 6px;margin:0}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent);position:relative}
#gridwrap{position:absolute;inset:0;display:none;flex-direction:column}
body[data-mode=grid] #gridwrap{display:flex}
body[data-mode=grid] #cv,body[data-mode=grid] aside,body[data-mode=grid] #reset{display:none}
#gv{height:auto;flex:1;min-height:0;cursor:default}
.gctl{display:flex;gap:6px 12px;align-items:center;padding:10px 12px;border-top:1px solid var(--border);flex-wrap:wrap;font-size:12px}
.gctl input[type=range]{flex:1;min-width:160px}.gctl label{display:flex;gap:5px;align-items:center;cursor:pointer}
#gt{min-width:210px;color:var(--muted);font-variant-numeric:tabular-nums}
</style></head><body>
<header>
<h1>Capacitance Line Explorer</h1>
<span class="meta" id="meta">Load a CSV with columns cap, row, col, time_s</span>
<span class="seg"><button id="m-lines" class="on">Lines</button><button id="m-grid">2-D grid</button></span>
<label class="btn">Open CSV…<input type="file" id="file" accept=".csv,text/csv" hidden></label>
<button id="reset">Reset zoom</button>
</header>
<main>
<div id="plotwrap"><canvas id="cv"></canvas><div id="gridwrap"><canvas id="gv"></canvas><div class="gctl"><button id="gplay">▶ Play</button><select id="gspd" title="Playback speed"><option value="1">1×</option><option value="2">2×</option><option value="5" selected>5×</option><option value="15">15×</option></select><input type="range" id="gk" min="0" max="0" value="0"><span id="gt"></span><label><input type="checkbox" id="graw"> Show raw pF in cells</label></div></div>
<div id="tip"></div><div id="drop">Drop CSV to plot</div></div>
<aside>
<div class="tools"><button id="all">All</button><button id="none">None</button><button id="inv">Invert</button>
<button id="byrow" title="Select all lines in the same row as the first selected line">Row of sel.</button>
<button id="bycol" title="Select all lines in the same column as the first selected line">Col of sel.</button></div>
<div class="opts">
<label><input type="checkbox" id="hide"> Hide unselected lines</label>
<label><input type="checkbox" id="fit"> Fit Y axis to selected</label>
<label>Dim others <input type="range" id="dim" min="0" max="60" value="15" style="flex:1"></label>
</div>
<div id="key"></div>
<div class="hint">Click a key entry to select it. Drag on the plot to zoom, double-click to reset. Hover a line to read values.</div>
</aside></main>

  const dec=s=>Math.max(0,-Math.floor(Math.log10(s)));
  ctx.textAlign='center';
  for(const v of xt.out){const x=X(v);ctx.beginPath();ctx.moveTo(x,M.t);ctx.lineTo(x,M.t+ph);ctx.stroke();ctx.fillText(v.toFixed(dec(xt.step)),x,M.t+ph+16)}
  ctx.textAlign='right';
  for(const v of yt.out){const y=Y(v);ctx.beginPath();ctx.moveTo(M.l,y);ctx.lineTo(M.l+pw,y);ctx.stroke();ctx.fillText(v.toFixed(dec(yt.step)),M.l-6,y+4)}
  ctx.textAlign='center';ctx.fillText('time (s)',M.l+pw/2,h-8);
  ctx.save();ctx.translate(14,M.t+ph/2);ctx.rotate(-Math.PI/2);ctx.fillText('capacitance (pF)',0,0);ctx.restore();
  ctx.save();ctx.beginPath();ctx.rect(M.l,M.t,pw,ph);ctx.clip();
  const any=sel.size>0,hide=$('hide').checked&&any,dim=$('dim').value/100;
  const isHi=s=>sel.has(s.key)||s.key===hoverKey;
  const plot=(s,alpha,lw)=>{ctx.globalAlpha=alpha;ctx.strokeStyle=s.color;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.beginPath();
    let started=false;for(let i=0;i<s.t.length;i++){const x=X(s.t[i]);if(x<M.l-50||x>M.l+pw+50){started=false;continue}
      const y=Y(s.y[i]);started?ctx.lineTo(x,y):ctx.moveTo(x,y);started=true}ctx.stroke()};
  if(!any&&!hoverKey)for(const s of series)plot(s,0.9,1.4);
  else{
    if(!hide)for(const s of series)if(!isHi(s))plot(s,dim,1);
    for(const s of series)if(isHi(s))plot(s,1,2.8);
  }
  ctx.restore();ctx.globalAlpha=1;
  ctx.strokeStyle=css('--border');ctx.strokeRect(M.l,M.t,pw,ph);
  if(drag){ctx.fillStyle='rgba(42,109,244,.15)';ctx.strokeStyle=css('--accent');
    const x=Math.min(drag.x0,drag.x1),y=Math.min(drag.y0,drag.y1);
    ctx.fillRect(x,y,Math.abs(drag.x1-drag.x0),Math.abs(drag.y1-drag.y0));ctx.strokeRect(x,y,Math.abs(drag.x1-drag.x0),Math.abs(drag.y1-drag.y0))}
  if(mouse&&!drag)hover(X,Y,hide);
}
function hover(X,Y,hide){
  const {V}=cv._m;const mx=mouse.x,my=mouse.y;let best=null,bd=14;
  const tx=V.x0+(mx-M.l)/cv._m.pw*(V.x1-V.x0);
  for(const s of series){if(hide&&!sel.has(s.key))continue;
    let lo=0,hi=s.t.length-1;while(lo<hi){const m=(lo+hi)>>1;s.t[m]<tx?lo=m+1:hi=m}
    for(const i of [lo-1,lo]){if(i<0||i>=s.t.length)continue;
      const d=Math.hypot(X(s.t[i])-mx,Y(s.y[i])-my);if(d<bd){bd=d;best={s,i}}}}
  if(!best){tip.style.display='none';return}
  const {s,i}=best,px=X(s.t[i]),py=Y(s.y[i]);
  ctx.beginPath();ctx.arc(px,py,4.5,0,7);ctx.fillStyle=s.color;ctx.fill();ctx.strokeStyle=css('--panel');ctx.lineWidth=1.5;ctx.stroke();
  tip.innerHTML=`<b style="color:${s.color}">Line ${s.key}</b><br>t = ${s.t[i].toFixed(4)} s<br>cap = ${s.y[i].toFixed(3)} pF`;
  tip.style.display='block';
  const tw=tip.offsetWidth;tip.style.left=Math.min(px+12,cv.clientWidth-tw-4)+'px';tip.style.top=Math.max(py-50,4)+'px';
}
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
cv.onmousedown=e=>{if(!series.length)return;const p=pos(e);drag={x0:p.x,y0:p.y,x1:p.x,y1:p.y};tip.style.display='none'};
window.addEventListener('mousemove',e=>{if(drag){const p=pos(e);drag.x1=p.x;drag.y1=p.y;draw()}});
cv.onmousemove=e=>{mouse=pos(e);if(!drag)draw()};
cv.onmouseleave=()=>{mouse=null;tip.style.display='none';draw()};
window.addEventListener('mouseup',()=>{
  if(!drag)return;const d=drag;drag=null;
  if(Math.abs(d.x1-d.x0)>6&&Math.abs(d.y1-d.y0)>6){
    const {V,pw,ph}=cv._m;const fx=x=>V.x0+(x-M.l)/pw*(V.x1-V.x0),fy=y=>V.y0+(1-(y-M.t)/ph)*(V.y1-V.y0);
    const xa=fx(Math.min(d.x0,d.x1)),xb=fx(Math.max(d.x0,d.x1)),ya=fy(Math.max(d.y0,d.y1)),yb=fy(Math.min(d.y0,d.y1));
    view={x0:xa,x1:xb,y0:ya,y1:yb}}
  draw()});
cv.ondblclick=()=>{view=null;draw()};
addEventListener('resize',draw);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);

function readFile(f){const r=new FileReader();r.onload=()=>load(r.result,f.name);r.readAsText(f)}
$('file').onchange=e=>{if(e.target.files[0])readFile(e.target.files[0]);e.target.value=''};
const dz=$('drop');
['dragenter','dragover'].forEach(t=>addEventListener(t,e=>{e.preventDefault();dz.style.display='flex'}));
['dragleave','drop'].forEach(t=>addEventListener(t,e=>{e.preventDefault();dz.style.display='none'}));
addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)readFile(f)});
/* ---------- 2-D grid mode ---------- */
let G={k:0,raf:0,playing:false,maxLen:0,maxAbs:1,rows:[],cols:[],map:new Map(),lay:null};
document.body.dataset.mode='lines';
function gridInit(){
  gridStop();G.k=0;G.map=new Map();G.maxAbs=1e-9;G.maxLen=0;
  for(const s of series){
    const n=Math.min(5,s.y.length);let a=0;for(let i=0;i<n;i++)a+=s.y[i];s.base=a/n;
    G.map.set(s.row+'_'+s.col,s);G.maxLen=Math.max(G.maxLen,s.y.length);
    for(const v of s.y)G.maxAbs=Math.max(G.maxAbs,Math.abs(v-s.base));}
  const rs=series.map(s=>s.row),cs=series.map(s=>s.col);
  const mm=a=>{let lo=Infinity,hi=-Infinity;for(const v of a){if(v<lo)lo=v;if(v>hi)hi=v}return a.length?Array.from({length:hi-lo+1},(_,i)=>lo+i):[]};
  G.rows=mm(rs);G.cols=mm(cs);
  const sl=$('gk');sl.max=Math.max(0,G.maxLen-1);sl.value=0;
  if(document.body.dataset.mode==='grid')gridDraw();
}
function setMode(m){
  document.body.dataset.mode=m;gridStop();tip.style.display='none';
  $('m-lines').classList.toggle('on',m==='lines');$('m-grid').classList.toggle('on',m==='grid');
  m==='grid'?gridDraw():draw();
}
$('m-lines').onclick=()=>setMode('lines');$('m-grid').onclick=()=>setMode('grid');
function divColor(t){ // t in [-1,1]: blue - white - red
  t=Math.max(-1,Math.min(1,t));const lo=[33,102,172],mid=[247,247,247],hi=[178,24,43];
  const e=t<0?lo:hi,a=Math.abs(t);
  return mid.map((m,i)=>Math.round(m+(e[i]-m)*a));
}
function frameVal(s,k){const i=Math.min(k,s.y.length-1);return{i,v:s.y[i],d:s.y[i]-s.base,t:s.t[i]}}
function gridDraw(){
  const gv=$('gv'),c=gv.getContext('2d'),w=gv.clientWidth,h=gv.clientHeight,dpr=devicePixelRatio||1;
  if(!w||!h)return;
  if(gv.width!==Math.round(w*dpr)||gv.height!==Math.round(h*dpr)){gv.width=Math.round(w*dpr);gv.height=Math.round(h*dpr)}
  c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  if(!series.length){c.fillStyle=css('--muted');c.font='15px system-ui';c.textAlign='center';c.fillText('Open or drop a CSV to begin',w/2,h/2);return}
  const L=44,T=30,R=76,B=10,aw=w-L-R,ah=h-T-B,nr=G.rows.length,nc=G.cols.length;
  const cw=aw/nc,ch=ah/nr,raw=$('graw').checked;
  G.lay={L,T,cw,ch};
  c.textAlign='center';c.fillStyle=css('--muted');c.font='12px system-ui';
  G.cols.forEach((v,j)=>c.fillText('col '+v,L+cw*(j+.5),T-10));
  c.textAlign='right';G.rows.forEach((v,i)=>c.fillText('row '+v,L-6,T+ch*(i+.5)+4));
  let tsum=0,tn=0;
  G.rows.forEach((r,i)=>G.cols.forEach((cl,j)=>{
    const x=L+cw*j+1,y=T+ch*i+1,s=G.map.get(r+'_'+cl);
    if(!s){c.strokeStyle=css('--grid');c.strokeRect(x,y,cw-2,ch-2);return}
    const f=frameVal(s,G.k);tsum+=f.t;tn++;
    const rgb=divColor(f.d/G.maxAbs);c.fillStyle=`rgb(${rgb})`;c.fillRect(x,y,cw-2,ch-2);
    const lum=(0.299*rgb[0]+0.587*rgb[1]+0.114*rgb[2]);const tc=lum>140?'#1d1d1b':'#fff';
    c.fillStyle=tc;c.textAlign='center';
    const fs=Math.max(9,Math.min(cw,ch)*0.24);c.font=`600 ${fs}px system-ui`;
    const txt=raw?f.v.toFixed(2):(f.d>=0?'+':'−')+Math.abs(f.d).toFixed(2);
    c.fillText(txt,x+(cw-2)/2,y+(ch-2)/2+fs*0.35);
    c.font=`${Math.max(8,fs*0.5)}px system-ui`;c.globalAlpha=.7;c.textAlign='left';
    c.fillText(s.key,x+5,y+Math.max(8,fs*0.5)+3);c.globalAlpha=1;
  }));
  // colour bar
  const bx=w-R+18,bw=14;
  for(let i=0;i<ah;i++){c.fillStyle=`rgb(${divColor(1-2*i/(ah-1))})`;c.fillRect(bx,T+i,bw,1.5)}
  c.strokeStyle=css('--border');c.strokeRect(bx,T,bw,ah);
  c.fillStyle=css('--muted');c.textAlign='left';c.font='11px system-ui';
  c.fillText('+'+G.maxAbs.toFixed(1),bx+bw+4,T+9);c.fillText('0',bx+bw+4,T+ah/2+4);c.fillText('−'+G.maxAbs.toFixed(1),bx+bw+4,T+ah);
  c.fillText('Δ pF',bx,T-10);
  $('gt').textContent=`frame ${G.k+1} / ${G.maxLen} · t ≈ ${tn?(tsum/tn).toFixed(3):'–'} s`;
}
function gridStop(){G.playing=false;cancelAnimationFrame(G.raf);$('gplay').textContent='▶ Play'}
function gridPlay(){
  if(G.playing){gridStop();return}
  G.playing=true;$('gplay').textContent='❚❚ Pause';
  if(G.k>=G.maxLen-1)G.k=0;
  const step=()=>{if(!G.playing)return;
    G.k+=+$('gspd').value;if(G.k>=G.maxLen-1){G.k=G.maxLen-1;gridDraw();$('gk').value=G.k;gridStop();return}
    $('gk').value=G.k;gridDraw();G.raf=requestAnimationFrame(step)};
  G.raf=requestAnimationFrame(step);
}
$('gplay').onclick=gridPlay;
$('gk').oninput=e=>{G.k=+e.target.value;gridDraw()};
$('graw').onchange=gridDraw;
$('gv').onmousemove=e=>{
  if(!G.lay)return;const r=$('gv').getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const j=Math.floor((x-G.lay.L)/G.lay.cw),i=Math.floor((y-G.lay.T)/G.lay.ch);
  const s=G.map.get(G.rows[i]+'_'+G.cols[j]);
  if(!s||j<0||i<0){tip.style.display='none';return}
  const f=frameVal(s,G.k);
  tip.innerHTML=`<b>Line ${s.key}</b><br>t = ${f.t.toFixed(4)} s<br>cap = ${f.v.toFixed(3)} pF<br>baseline = ${s.base.toFixed(3)} pF<br>Δ = ${f.d.toFixed(3)} pF`;
  tip.style.display='block';const tw=tip.offsetWidth;
  tip.style.left=Math.min(x+14,$('plotwrap').clientWidth-tw-4)+'px';tip.style.top=Math.max(y-20,4)+'px';
};
$('gv').onmouseleave=()=>{tip.style.display='none'};
addEventListener('resize',()=>{if(document.body.dataset.mode==='grid')gridDraw()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(document.body.dataset.mode==='grid')gridDraw()});
if(SAMPLE_CSV.trim())load(SAMPLE_CSV,'sample data');else draw();
</script></body></html>
