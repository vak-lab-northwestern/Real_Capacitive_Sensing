[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Must match SERIAL_BAUD in src/main.cpp and --baud in cap_heatmap.py
monitor_speed = 115200
upload_speed = 921600

; Your FDC2214x driver lives in lib/Fast_FDC_Driver/ (FDC2214x.h + FDC2214x.cpp),
; so PlatformIO finds it automatically. No lib_deps needed.
lib_ldf_mode = chain+