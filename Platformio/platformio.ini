
[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = chain+
build_src_filter = -<*> +<main.cpp>

[env:esp32doit-devkit-v1_row_row]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = chain+
build_src_filter = -<*> +<main_row_row.cpp>


[env:arduino_nano_esp32_prostheTEX]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600
lib_ldf_mode = chain+
build_src_filter = -<*> +<main_prostheTEX.cpp>


